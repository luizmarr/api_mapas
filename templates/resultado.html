<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link rel="stylesheet" href="/static/style.css">

    <title>Resultado da Geocodificação</title>
</head>



<body>

    <div class="resultado">
        <h2>Resultado da Busca</h2>

        <p><strong>País:</strong> {{ resultado.pais }}</p>

        <p><strong>Endereço:</strong> {{ resultado.endereco }}</p>

        <p><strong>CEP:</strong> {{ resultado.cep }}</p>

        <p><strong>Latitude:</strong> {{ resultado.latitude }}</p>

        <p><strong>Longitude:</strong> {{ resultado.longitude }}</p>

        <div id="map"></div>

        <a href="/" class="btn-voltar">Nova Pesquisa</a>
    </div>

</body>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const latitude = '{{ resultado.latitude }}';
    const longitude = '{{ resultado.longitude }}';

    console.log(latitude);
    console.log(longitude);

    const map = L.map('map').setView([latitude, longitude], 15);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 20
}).addTo(map);

const marcador = L.marker([latitude, longitude]).addTo(map);

marcador.bindPopup(`
    <strong>📍 Localização encontrada</strong><br>
    {{ resultado.endereco }}
`).openPopup();
</script>

</html>
